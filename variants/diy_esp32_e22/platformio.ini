; =========================================================
; ESP32 + EBYTE E22
; =========================================================
[diy_esp32_e22]
extends = esp32_base
board = esp32doit-devkit-v1
build_flags =
    ${esp32_base.build_flags}
    -I variants/diy_esp32_e22
    -D LORA_BW=250.0
    -D LORA_SF=10
    -D LORA_CR=5
    -D P_LORA_NSS=5
    -D P_LORA_SCLK=18
    -D P_LORA_MOSI=23
    -D P_LORA_MISO=19
    -D P_LORA_DIO_1=33
    -D P_LORA_BUSY=32
    -D P_LORA_RESET=27
    -D SX126X_RXEN=14
    -D SX126X_TXEN=RADIOLIB_NC
    -D SX126X_DIO2_AS_RF_SWITCH=true
    -D SX126X_DIO3_TCXO_VOLTAGE=1.8
    -D SX126X_CURRENT_LIMIT=140
    -D SX126X_RX_BOOSTED_GAIN=1
    -D LORA_TX_POWER=22
    -D MANUFACTURER_STRING='"Generic ESP32 + E22"'
build_src_filter =
    ${esp32_base.build_src_filter}
    +<../variants/diy_esp32_e22>

[env:diy_esp32_e22_sx1268_companion_radio_usb]
extends = diy_esp32_e22
build_flags =
    ${diy_esp32_e22.build_flags}
    -D MAX_CONTACTS=250
    -D MAX_GROUP_CHANNELS=8
    -D OFFLINE_QUEUE_SIZE=64
    -D ENABLE_USB_INTERFACE
    -D USE_SX1268
    -D RADIO_CLASS=CustomSX1268
    -D WRAPPER_CLASS=CustomSX1268Wrapper
    -D LORA_FREQ=433.0
;   -D MESH_PACKET_LOGGING=1
;   -D MESH_DEBUG=1
build_src_filter =
    ${diy_esp32_e22.build_src_filter}
    +<../examples/companion_radio/*.cpp>
lib_deps =
    ${diy_esp32_e22.lib_deps}
    densaugeo/base64 @ ~1.4.0

[env:diy_esp32_e22_sx1268_room_server]
extends = diy_esp32_e22
build_flags =
  ${diy_esp32_e22.build_flags}
  -D ADVERT_NAME='"diy_esp32_e22 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D USE_SX1268
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_FREQ=433.0
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = 
  ${diy_esp32_e22.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${diy_esp32_e22.lib_deps}
  ${esp32_ota.lib_deps}